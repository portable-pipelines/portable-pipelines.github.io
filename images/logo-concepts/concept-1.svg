<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 80" role="img" aria-labelledby="title">
  <title id="title">Portable Pipelines</title>
  <style>
    .flow { animation: recflow 2.8s linear infinite; }
    @keyframes recflow {
      0% { transform: translateX(-18px); opacity: 0; }
      14% { opacity: 1; }
      86% { opacity: 1; }
      100% { transform: translateX(38px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow { animation: none; opacity: 1; transform: none; }
    }
  </style>
  <rect width="560" height="80" fill="#100f0c"/>
  <g transform="translate(0 8)">
    <defs>
      <clipPath id="bore">
        <rect x="8" y="24.5" width="48" height="7" rx="3.5"/>
        <rect x="38.5" y="28" width="7" height="26" rx="3.5"/>
      </clipPath>
    </defs>
    <rect width="64" height="64" rx="12" fill="#100f0c"/>
    <path d="M8 28h48M42 28v26" fill="none" stroke="#9dcc8e" stroke-width="12" stroke-linecap="round"/>
    <path d="M8 28h48M42 28v26" fill="none" stroke="#161c16" stroke-width="7" stroke-linecap="round"/>
    <rect x="15" y="20" width="4" height="16" rx="1" fill="#dbb56a"/>
    <rect x="32" y="20" width="4" height="16" rx="1" fill="#dbb56a"/>
    <rect x="36" y="50" width="12" height="4" rx="1" fill="#dbb56a"/>
    <g clip-path="url(#bore)">
      <g class="flow">
        <rect x="10" y="25.5" width="7" height="5" rx="1.6" fill="#cfe0c6"/>
        <rect x="22" y="25.5" width="7" height="5" rx="1.6" fill="#9dcc8e"/>
        <rect x="39.5" y="36" width="5" height="7" rx="1.6" fill="#dbb56a"/>
      </g>
    </g>
  </g>
  <text
    x="80"
    y="47"
    fill="#f1ebe3"
    font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace"
    font-size="28"
    font-weight="600"
    letter-spacing="0.02em"
  >Portable Pipelines</text>
</svg>
