<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Portable Pipelines</title>
  <rect width="64" height="64" rx="12" fill="#101612"/>
  <!-- barrel -->
  <rect x="8" y="27" width="48" height="10" rx="2" fill="#7ec87e"/>
  <!-- left flange -->
  <rect x="14" y="21" width="5" height="22" rx="1.2" fill="#d4b45a"/>
  <!-- right flange -->
  <rect x="45" y="21" width="5" height="22" rx="1.2" fill="#d4b45a"/>
  <!-- coupler ring -->
  <circle cx="32" cy="32" r="12" fill="#101612" stroke="#d4b45a" stroke-width="3"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="#7ec87e" stroke-width="1.25" opacity="0.85"/>
  <!-- pipe character -->
  <rect x="30" y="22" width="4" height="20" rx="1" fill="#7ec87e"/>
</svg>
